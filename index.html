<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#305d50"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Recipe Manager"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="style.css"><title>Recipe Manager Tablet</title></head><body><header><div><small>TABLET EDITION · v0.2.0 TEST</small><h1>Recipe Manager</h1></div><div class="header-actions"><button id="theme">☾ Theme</button><button id="new" class="primary">＋ New recipe</button><label class="import-btn" for="file">Import</label><input type="file" id="file" multiple hidden><button id="backup">Backup</button><label class="import-btn secondary" for="restore">Restore</label><input type="file" id="restore" hidden><button id="print">Print</button></div></header><main><aside><div class="library-heading"><h2>My Recipes <span id="count">0</span></h2><input id="search" type="search" placeholder="Search recipes, ingredients…"><div class="filters"><select id="folderFilter" aria-label="Folder"></select><select id="sort" aria-label="Sort"><option value="name">Name A–Z</option><option value="recent">Recently modified</option><option value="oldest">Oldest modified</option></select><label class="favfilter"><input id="favoritesOnly" type="checkbox"> ★ Favorites</label></div><div class="folder-actions"><button id="addFolder">＋ Folder</button><button id="renameFolder">Rename folder</button><button id="deleteFolder">Delete folder</button></div></div><div id="library" class="library"></div></aside><section id="detail" class="detail"></section></main><div id="toast" role="status" aria-live="polite"></div><dialog id="editor"><form id="recipeForm"><div class="dialog-head"><h2 id="editorTitle">Recipe</h2><button type="button" id="cancelEdit">✕ Close</button></div><div class="edit-grid"><label>Name<input name="name" required maxlength="200"></label><label>Folder<select name="folder"></select></label><label>Prep (minutes)<input name="prepTimeMinutes" type="number" min="0"></label><label>Cook (minutes)<input name="cookTimeMinutes" type="number" min="0"></label><label>Servings<input name="servings" type="number" min="1" value="1"></label></div><label>Description<textarea name="description" rows="2"></textarea></label><h3>Ingredients and sections</h3><p class="subtle">Use + Section for a heading. Move items with ↑ ↓. Quantities support fractions such as 1/2.</p><div id="ingredientEditor"></div><div class="editor-buttons"><button type="button" id="addIngredient">＋ Ingredient</button><button type="button" id="addSection">＋ Section</button></div><h3>Instructions</h3><div id="instructionEditor"></div><button type="button" id="addStep">＋ Step</button><label>Notes<textarea name="notes" rows="3"></textarea></label><div class="dialog-footer"><button type="button" id="cancelEdit2">Cancel</button><button class="primary" type="submit">Save recipe</button></div></form></dialog><script src="app.js" defer></script></body></html>
